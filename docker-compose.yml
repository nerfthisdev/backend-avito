version: "3.9"

services:
  db:
    image: postgres:16
    container_name: pr_assigner_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: avito_db 
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d avito_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db_data:

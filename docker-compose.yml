services:
  db:
    image: postgres:16
    container_name: pr_assigner_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: avito_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d avito_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pr_assigner_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_DSN: postgres://admin:admin@db:5432/avito_db?sslmode=disable
      SERVICE_PORT: "8080"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  db_data:
